components:
  schemas:
    ErrorEnvelope:
      type: object
      required:
      - error
      - action
      - target
      - request_id
      properties:
        error:
          type: string
        action:
          type: string
        target:
          type: string
        request_id:
          type: string
          format: uuid
    SnapshotPage:
      type: object
      required:
      - schema
      - items
      - page
      properties:
        schema:
          type: string
          enum:
          - clusterd-page/v1
        items:
          type: array
          items:
            type: object
        page:
          type: object
          required:
          - limit
          - count
          - has_more
          - next_cursor
          - snapshot_id
          - observed_at_ms
          - expires_in_s
          - truncated
          properties:
            limit:
              type: integer
              minimum: 1
              maximum: 200
            count:
              type: integer
              minimum: 0
              maximum: 200
            has_more:
              type: boolean
            next_cursor:
              type: string
              nullable: true
            snapshot_id:
              type: string
            observed_at_ms:
              type: integer
            expires_in_s:
              type: integer
              minimum: 0
            truncated:
              type: boolean
    ConfirmationChallenge:
      type: object
      required:
      - schema
      - token
      - operation
      - target
      - actor
      - action_digest
      - created_ms
      - ttl_s
      properties:
        schema:
          type: string
          enum:
          - confirmation/v1
        token:
          type: string
          description: single-use; send back as X-Confirm-Token
        operation:
          type: string
        target:
          type: string
        actor:
          type: string
        action_digest:
          type: string
          description: "sha256 of canonical JSON {operation,target,actor,args} \u2014\
            \ binds the confirmation to exactly that action"
        created_ms:
          type: integer
        ttl_s:
          type: integer
          default: 900
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "Scoped bearer token, format dcd_<uuid4hex> (issue #18, design\
        \ \xA72/\xA73). ENFORCED: tokens are sha256-hashed at rest in state_dir/auth/tokens.json\
        \ (auth-token/v1); manage via `scripts/clusterd --token-create | --token-revoke\
        \ | --token-list`. Scopes are exact operation classes (fleet:read, lifecycle:write,\
        \ backup:write, etc.). Owner-scoped tokens may only touch their own daimons.\
        \ Revocation takes effect without restart. Every route except GET /v1/health\
        \ requires a token (default-deny)."
