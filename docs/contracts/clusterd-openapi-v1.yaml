        '401':
          description: 'missing/unknown/expired/revoked bearer token ({error: unauthorized})'
          content: &id004
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 'authenticated but denied: insufficient scope, not your daimon
            (owner mismatch), or unattended-steward-denied'
          content: *id004
        '500':
          description: internal error (CLI exit 10)
          content: *id004
  /v1/instances/{name}/logs:
    get:
      operationId: getInstanceLogs
      summary: 'Bounded, secret-redacted instance logs (steward window, issue #22)'
      description: "Uses `clusterctl logs <name> --lines <n> --json` as its source;\
        \ mutations retain the same clusterctl business-logic boundary while reads\
        \ may add owner scoping, redaction, observation envelopes, and bounded snapshot\
        \ pagination.\n\nRequired bearer scope: `fleet:read` \u2014 enforced (issue\
        \ #18). Owner-scoped tokens may only touch daimons whose spec created_by matches\
        \ the owner."
      parameters:
      - name: X-Request-Id
        in: header
        required: false
        description: Echoed back; a uuid4 is generated when absent.
        schema:
          type: string
          format: uuid
      - name: X-Actor
        in: header
        required: false
        description: Advisory only. Authenticated routes use the bearer token actor
          as the authoritative actor.
        schema:
          type: string
          default: anonymous
      - name: name
        in: path
        required: true
        schema:
          type: string
      - name: lines
        in: query
        required: false
        description: Max log lines returned (bounded; clusterctl clamps to its own
          max). Redaction is applied by clusterctl before any bytes leave the host.
        schema:
          type: integer
          default: 100
          minimum: 1
          maximum: 1000
      security:
      - bearerAuth: []
      responses:
        '200':
          description: clusterctl result JSON (exit 0)
        '401':
          description: 'missing/unknown/expired/revoked bearer token ({error: unauthorized})'
          content: &id005
            application/json:
