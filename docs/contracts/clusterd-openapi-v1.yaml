          maxLength: 16384
      - name: X-Confirm
        in: header
        required: false
        description: '''none'' executes non-destructive mutations (start/stop/restart)
          directly. Destructive-class routes ALWAYS require a confirmation token regardless.'
        schema:
          type: string
          enum:
          - none
      - name: X-Confirm-Token
        in: header
        required: false
        description: 'Single-use confirmation/v1 token from the 409 challenge. Validated
          against the action digest (operation+target+actor+args): expired/reused/altered/wrong-actor/wrong-target
          -> 409.'
        schema:
          type: string
      security:
      - bearerAuth: []
      responses:
        '200':
          description: clusterctl result JSON (exit 0)
        '401':
          description: 'missing/unknown/expired/revoked bearer token ({error: unauthorized})'
          content: &id009
            application/json:
              schema: &id010
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 'authenticated but denied: insufficient scope, not your daimon
            (owner mismatch), or unattended-steward-denied'
          content: *id009
        '404':
          description: not found (CLI exit 3)
          content: *id009
        '409':
          description: 'confirmation required: body is a confirmation/v1 challenge
            (first POST) or a rejection (expired/reused/altered-digest/wrong-actor/wrong-target
            token)'
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ConfirmationChallenge'
                - *id010
        '429':
          description: 'mutation rate limit: 60 mutations/minute per token (sliding
            window)'
          content: *id009
        '501':
          description: confirmation validated; destroy execution is a later milestone
          content: *id009
        '500':
          description: internal error (CLI exit 10)
          content: *id009
