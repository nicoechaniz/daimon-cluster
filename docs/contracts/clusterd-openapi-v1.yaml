        schema:
          type: string
          default: anonymous
      - name: name
        in: path
        required: true
        schema:
          type: string
      - name: lines
        in: query
        required: false
        description: Max log lines returned (bounded; clusterctl clamps to its own
          max). Redaction is applied by clusterctl before any bytes leave the host.
        schema:
          type: integer
          default: 100
          minimum: 1
          maximum: 1000
      security:
      - bearerAuth: []
      responses:
        '200':
          description: clusterctl result JSON (exit 0)
        '401':
          description: 'missing/unknown/expired/revoked bearer token ({error: unauthorized})'
          content: &id005
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 'authenticated but denied: insufficient scope, not your daimon
