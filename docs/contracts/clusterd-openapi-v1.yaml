      description: "Delegates to `clusterctl destroy <name> (archive-first; future\
        \ milestone)` \u2014 the same code path as the CLI; clusterd adds no business\
        \ logic.\n\nRequired bearer scope: `mutate` \u2014 enforced (issue #18). Owner-scoped\
        \ tokens may only touch daimons whose spec created_by matches the owner."
