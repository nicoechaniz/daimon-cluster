openapi: 3.0.3
info:
  title: clusterd
  version: 0.1.0
  description: 'HTTP API over clusterctl (issue #17; design: docs/design/clusterd.md).
    Mutations adapt clusterctl; read models add owner scoping, redaction, explicit
    observation boundaries and bounded snapshot pagination. Errors mirror clusterctl
    exit codes: 0->200, 2->400, 3->404, 6->409, 10->500.'
servers:
- url: http://127.0.0.1:8785
  description: loopback (host ops)
- url: http://10.105.93.1:8785
  description: incus bridge gateway (steward container; private only, never a public
    bind)
paths:
  /v1/health:
    get:
      operationId: getHealth
      summary: clusterd liveness + clusterctl reachability
      description: 'Uses `config load + list (reachability probe)` as its source;
        mutations retain the same clusterctl business-logic boundary while reads may
        add owner scoping, redaction, observation envelopes, and bounded snapshot
        pagination.


        Required bearer scope: `None` (route is public)'
      parameters:
      - name: X-Request-Id
        in: header
        required: false
        description: Echoed back; a uuid4 is generated when absent.
        schema:
          type: string
          format: uuid
      - name: X-Actor
        in: header
        required: false
        description: Advisory only. Authenticated routes use the bearer token actor
          as the authoritative actor.
        schema:
          type: string
          default: anonymous
      security: []
      responses:
        '200':
          description: clusterctl result JSON (exit 0)
        '500':
          description: internal error (CLI exit 10)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/openapi.yaml:
    get:
      operationId: getOpenapi
      summary: OpenAPI 3.0 document generated from the route table
      description: "Uses `n/a (generated from clusterd.routes)` as its source; mutations\
        \ retain the same clusterctl business-logic boundary while reads may add owner\
        \ scoping, redaction, observation envelopes, and bounded snapshot pagination.\n\
        \nRequired bearer scope: `metadata:read` \u2014 enforced (issue #18). Owner-scoped\
        \ tokens may only touch daimons whose spec created_by matches the owner."
      parameters:
      - name: X-Request-Id
        in: header
        required: false
        description: Echoed back; a uuid4 is generated when absent.
        schema:
          type: string
          format: uuid
      - name: X-Actor
        in: header
        required: false
        description: Advisory only. Authenticated routes use the bearer token actor
          as the authoritative actor.
        schema:
          type: string
          default: anonymous
      security:
      - bearerAuth: []
      responses:
        '200':
          description: clusterctl result JSON (exit 0)
        '401':
          description: 'missing/unknown/expired/revoked bearer token ({error: unauthorized})'
          content: &id001
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 'authenticated but denied: insufficient scope, not your daimon
            (owner mismatch), or unattended-steward-denied'
          content: *id001
        '500':
          description: internal error (CLI exit 10)
          content: *id001
  /v1/instances:
    get:
      operationId: listInstances
      summary: Paginate owner-scoped reconciled instance observations
      description: "Uses `clusterctl list --json` as its source; mutations retain\
        \ the same clusterctl business-logic boundary while reads may add owner scoping,\
        \ redaction, observation envelopes, and bounded snapshot pagination.\n\nRequired\
        \ bearer scope: `fleet:read` \u2014 enforced (issue #18). Owner-scoped tokens\
        \ may only touch daimons whose spec created_by matches the owner."
      parameters:
      - name: X-Request-Id
        in: header
        required: false
        description: Echoed back; a uuid4 is generated when absent.
        schema:
          type: string
          format: uuid
      - name: X-Actor
        in: header
        required: false
        description: Advisory only. Authenticated routes use the bearer token actor
          as the authoritative actor.
        schema:
          type: string
          default: anonymous
      - name: limit
        in: query
        required: false
        description: Page size (default 50, max 200)
        schema:
          type: integer
          default: 50
          minimum: 1
          maximum: 200
      - name: cursor
        in: query
        required: false
        description: Opaque next_cursor from the preceding page
        schema:
          type: string
          maxLength: 512
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Bounded immutable snapshot page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotPage'
        '400':
          description: invalid limit/cursor or cursor scope mismatch
          content: &id002
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: cursor snapshot expired or was evicted; restart pagination
          content: *id002
        '401':
          description: 'missing/unknown/expired/revoked bearer token ({error: unauthorized})'
          content: *id002
        '403':
          description: 'authenticated but denied: insufficient scope, not your daimon
            (owner mismatch), or unattended-steward-denied'
          content: *id002
        '500':
          description: internal error (CLI exit 10)
          content: *id002
  /v1/instances/{name}:
