name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-weave.txt
            requirements-dev.txt
            constraints.txt
      - run: python -m pip install -c constraints.txt -r requirements-dev.txt
      - name: Verify exact Matrix source pin
        run: |
          python - <<'PY'
          import importlib.metadata
          import json

          from clusterctl.matrix_host import MATRIX_CONTRACT_COMMIT

          direct_url = json.loads(
              importlib.metadata.distribution("daimon-matrix").read_text(
                  "direct_url.json"
              )
          )
          assert direct_url["vcs_info"]["commit_id"] == MATRIX_CONTRACT_COMMIT
          assert (
              importlib.metadata.distribution("daimon-matrix")
              .metadata["License-Expression"]
              == "MIT"
          )
          PY
      - name: Lint the Matrix, fence and mutation-journal boundaries
        run: >-
          python -m ruff check
          clusterctl/admission.py
          clusterctl/audit.py
          clusterctl/adapters.py
          clusterctl/cli.py
          clusterctl/distributed_rebirth.py
          clusterctl/embodiments.py
          clusterctl/fences.py
          clusterctl/idempotency.py
          clusterctl/inventory.py
          clusterctl/production_fences.py
          clusterctl/leases.py
          clusterctl/locks.py
          clusterctl/lifecycle.py
          clusterctl/matrix_host.py
          clusterctl/operation_journal.py
          clusterctl/park.py
          clusterctl/provision.py
          clusterctl/reconcile.py
          clusterctl/rebirth.py
          clusterctl/rebirth_host.py
          clusterctl/recovery_rebirth.py
          clusterctl/transfer.py
          clusterd/__main__.py
          clusterd/approvals.py
          clusterd/auth.py
          clusterd/confirm.py
          clusterd/handlers.py
          clusterd/openapi.py
          clusterd/routes.py
          clusterd/server.py
          steward_tools/mutations.py
          tests/test_matrix_host.py
          tests/test_admission.py
          tests/test_matrix_host_process.py
          tests/test_matrix_parity.py
          tests/test_matrix_status.py
          tests/test_operation_journal.py
          tests/test_park.py
          tests/test_production_fences.py
          tests/test_rebirth.py
          tests/test_recovery_rebirth.py
          tests/integration/recovery-rebirth/role.py
          tests/integration/test_recovery_rebirth_containers.py
          tests/test_transfer.py
          tests/test_volume_relocation.py
          tests/test_human_approvals.py
          tests/test_physical_preflight.py
          tests/test_rc_manifest.py
          scripts/h3-volume-drill.py
          tools/build_physical_preflight.py
          tools/build_rc_manifest.py
          tools/check_rc_types.py
      - name: Type-check the Matrix, fence and mutation-journal boundaries
        run: python tools/check_rc_types.py
      - run: >-
          python -m compileall -q clusterctl clusterd steward_tools tests tools
      - run: >-
          python -m pytest -q
          -W error::ResourceWarning
          -W error::pytest.PytestUnraisableExceptionWarning

  backup-export-disposable:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - run: python -m pip install pytest==9.0.2
      - name: Verify disposable proof prerequisites
        run: |
          set -eu
          for tool in docker rsync ssh ssh-keygen ssh-keyscan; do
            command -v "$tool"
          done
          docker version
      - name: Prove isolated exporter and offline encrypted restore
        env:
          DAIMON_RUN_DOCKER_TESTS: "1"
        run: >-
          python -m pytest -q -s
          -W error::ResourceWarning
          -W error::pytest.PytestUnraisableExceptionWarning
          tests/integration/test_restic_export_container.py

  recovery-rebirth-disposable-hosts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: AlterMundi/daimon-matrix
          ref: 7266de8551ae861f3773c587bf907cfcddde6ffd
          path: matrix-source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13.5"
      - run: python -m pip install pytest==9.0.2
      - name: Verify disposable proof prerequisites
        run: |
          set -eu
          for tool in docker git; do
            command -v "$tool"
          done
          docker version
          test "$(git -C matrix-source rev-parse HEAD)" = \
            7266de8551ae861f3773c587bf907cfcddde6ffd
      - name: Prove isolated recovery roles and read-only snapshot restore
        env:
          DAIMON_RUN_DOCKER_RECOVERY_TESTS: "1"
          DAIMON_MATRIX_SOURCE: ${{ github.workspace }}/matrix-source
        run: >-
          python -m pytest -q -s
          -W error::ResourceWarning
          -W error::pytest.PytestUnraisableExceptionWarning
          tests/integration/test_recovery_rebirth_containers.py
