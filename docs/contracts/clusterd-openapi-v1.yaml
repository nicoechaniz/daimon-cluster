  /v1/instances/{name}/destroy:
    post:
      operationId: destroyInstance
      summary: "Destroy an instance (destructive: two-step prepare/confirm; execution\
        \ is a later milestone \u2014 501 after validation)"
      description: "Uses `clusterctl destroy <name> (archive-first; future milestone)`\
        \ as its source; mutations retain the same clusterctl business-logic boundary\
        \ while reads may add owner scoping, redaction, observation envelopes, and\
        \ bounded snapshot pagination.\n\nRequired bearer scope: `destroy:write` \u2014\
        \ enforced (issue #18). Owner-scoped tokens may only touch daimons whose spec\
        \ created_by matches the owner."
      parameters:
      - name: X-Request-Id
        in: header
        required: false
        description: Echoed back; a uuid4 is generated when absent.
        schema:
          type: string
          format: uuid
      - name: X-Actor
        in: header
        required: false
