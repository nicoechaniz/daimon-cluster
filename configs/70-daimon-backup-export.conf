# Dedicated ciphertext-only backup exporter. This Match block must never name
# or alter an established administrative identity.
Match User daimon-backup-export
    AuthenticationMethods publickey
    PubkeyAuthentication yes
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AuthorizedKeysFile /etc/daimon-backup/export-keys
    ForceCommand /opt/daimon-cluster/scripts/restic-export-command.sh
    DisableForwarding yes
    PermitTTY no
    X11Forwarding no
    PermitTunnel no

Match all
