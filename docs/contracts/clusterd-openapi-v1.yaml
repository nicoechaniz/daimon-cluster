openapi: 3.0.3
info:
  title: clusterd
  version: 0.1.0
  description: "Thin HTTP API over clusterctl (issue #17; design: docs/design/clusterd.md).\
    \ Every route adapts a clusterctl.cli.run invocation or reads state files clusterctl\
    \ writes \u2014 no business logic is duplicated. Errors mirror clusterctl exit\
    \ codes: 0->200, 2->400, 3->404, 6->409, 10->500."
servers:
- url: http://127.0.0.1:8785
  description: loopback (host ops)
- url: http://10.105.93.1:8785
  description: incus bridge gateway (steward container; private only, never a public
    bind)
paths:
  /v1/health:
    get:
      operationId: getHealth
      summary: clusterd liveness + clusterctl reachability
      description: "Delegates to `config load + list (reachability probe)` \u2014\
        \ the same code path as the CLI; clusterd adds no business logic.\n\nRequired\
        \ bearer scope: `None` (route is public)"
      parameters:
      - name: X-Request-Id
        in: header
        required: false
        description: Echoed back; a uuid4 is generated when absent.
        schema:
          type: string
          format: uuid
      - name: X-Actor
        in: header
        required: false
        description: 'Actor recorded in clusterctl audit events (default: anonymous).'
        schema:
          type: string
          default: anonymous
      security: []
      responses:
        '200':
          description: clusterctl result JSON (exit 0)
        '500':
          description: internal error (CLI exit 10)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/openapi.yaml:
    get:
      operationId: getOpenapi
      summary: OpenAPI 3.0 document generated from the route table
      description: "Delegates to `n/a (generated from clusterd.routes)` \u2014 the\
        \ same code path as the CLI; clusterd adds no business logic.\n\nRequired\
        \ bearer scope: `read` \u2014 enforced (issue #18). Owner-scoped tokens may\
        \ only touch daimons whose spec created_by matches the owner."
      parameters:
      - name: X-Request-Id
        in: header
        required: false
        description: Echoed back; a uuid4 is generated when absent.
        schema:
          type: string
          format: uuid
      - name: X-Actor
        in: header
        required: false
        description: 'Actor recorded in clusterctl audit events (default: anonymous).'
        schema:
          type: string
          default: anonymous
      security:
      - bearerAuth: []
      responses:
        '200':
          description: clusterctl result JSON (exit 0)
        '401':
          description: 'missing/unknown/expired/revoked bearer token ({error: unauthorized})'
          content: &id001
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 'authenticated but denied: insufficient scope, not your daimon
            (owner mismatch), or unattended-steward-denied'
          content: *id001
        '500':
          description: internal error (CLI exit 10)
          content: *id001
  /v1/instances:
    get:
      operationId: listInstances
      summary: List all instances with reconciled state
      description: "Delegates to `clusterctl list --json` \u2014 the same code path\
