components:
  schemas:
    ErrorEnvelope:
      type: object
      required:
      - error
      - action
      - target
      - request_id
      properties:
        error:
          type: string
        action:
          type: string
        target:
          type: string
        request_id:
          type: string
          format: uuid
    ConfirmationChallenge:
      type: object
      required:
      - schema
      - token
      - operation
      - target
      - actor
      - action_digest
      - created_ms
      - ttl_s
      properties:
        schema:
          type: string
          enum:
          - confirmation/v1
        token:
          type: string
          description: single-use; send back as X-Confirm-Token
        operation:
          type: string
        target:
          type: string
        actor:
          type: string
        action_digest:
          type: string
          description: "sha256 of canonical JSON {operation,target,actor,args} \u2014\
            \ binds the confirmation to exactly that action"
        created_ms:
          type: integer
        ttl_s:
          type: integer
          default: 900
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "Scoped bearer token, format dcd_<uuid4hex> (issue #18, design\
        \ \xA72/\xA73). ENFORCED: tokens are sha256-hashed at rest in state_dir/auth/tokens.json\
        \ (auth-token/v1); manage via `scripts/clusterd --token-create | --token-revoke\
        \ | --token-list`. Scopes: read, mutate. Owner-scoped tokens may only touch\
        \ their own daimons. Revocation takes effect without restart. Every route\
        \ except GET /v1/health requires a token (default-deny)."
