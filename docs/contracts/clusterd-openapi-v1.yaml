  /v1/instances/{name}/start:
    post:
      operationId: startInstance
      summary: Start a declared instance
      description: "Uses `clusterctl start <name> --idempotency-key <key> --json`\
        \ as its source; mutations retain the same clusterctl business-logic boundary\
        \ while reads may add owner scoping, redaction, observation envelopes, and\
        \ bounded snapshot pagination.\n\nRequired bearer scope: `lifecycle:write`\
        \ \u2014 enforced (issue #18). Owner-scoped tokens may only touch daimons\
        \ whose spec created_by matches the owner."
      parameters:
      - name: X-Request-Id
        in: header
        required: false
        description: Echoed back; a uuid4 is generated when absent.
        schema:
          type: string
          format: uuid
      - name: X-Actor
        in: header
        required: false
        description: Advisory only. Authenticated routes use the bearer token actor
          as the authoritative actor.
        schema:
          type: string
          default: anonymous
      - name: name
        in: path
        required: true
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        required: true
        description: 'uuid. Retry with the same key replays the cached clusterctl
          result (idempotent-replay: true); reuse for a different operation/target
          is a 409 conflict. Dedupe is clusterctl''s own idempotency store.'
        schema:
          type: string
          format: uuid
      - name: X-Human-Approval
        in: header
        required: false
        description: Base64url clusterd-human-approval/v1 artifact. Required for steward@*
          execution and signed by a separately provisioned human authority over the
          exact 409 intent. Caller attendance headers carry no authority.
        schema:
          type: string
          maxLength: 16384
      - name: X-Confirm
        in: header
        required: false
        description: '''none'' executes non-destructive mutations (start/stop/restart)
          directly. Destructive-class routes ALWAYS require a confirmation token regardless.'
        schema:
          type: string
          enum:
          - none
      security:
      - bearerAuth: []
      responses:
        '200':
          description: clusterctl result JSON (exit 0)
        '401':
          description: 'missing/unknown/expired/revoked bearer token ({error: unauthorized})'
          content: &id006
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 'authenticated but denied: insufficient scope, not your daimon
            (owner mismatch), or unattended-steward-denied'
          content: *id006
        '400':
          description: missing Idempotency-Key
          content: *id006
        '404':
          description: not found (CLI exit 3)
          content: *id006
        '409':
          description: 'conflict (CLI exit 6: idempotency-key reuse, lock held)'
          content: *id006
        '429':
          description: 'mutation rate limit: 60 mutations/minute per token (sliding
            window)'
          content: *id006
        '500':
          description: internal error (CLI exit 10)
          content: *id006
