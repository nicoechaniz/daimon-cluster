name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-weave.txt
            requirements-dev.txt
            constraints.txt
      - name: Harden and record the trusted qualification interpreter
        env:
          EXPECTED_PYTHON: ${{ matrix.python-version }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import stat
          import subprocess
          import sys
          from pathlib import Path

          from tools.qualify_offline import _owner_file

          executable = Path(sys.executable).resolve(strict=True)
          base_prefix = Path(sys.base_prefix).resolve(strict=True)
          tool_cache = Path(os.environ["RUNNER_TOOL_CACHE"]).resolve(strict=True)
          before = executable.stat()
          assert f"{sys.version_info.major}.{sys.version_info.minor}" == os.environ["EXPECTED_PYTHON"]
          assert executable.is_relative_to(tool_cache / "Python")
          assert executable.parent == base_prefix / "bin"
          assert stat.S_ISREG(before.st_mode)
          trusted = base_prefix / "bin" / f".daimon-trusted-python-{os.environ['EXPECTED_PYTHON']}"
          source = os.open(executable, os.O_RDONLY | os.O_NOFOLLOW)
          target = os.open(trusted, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o500)
          digest = hashlib.sha256()
          try:
              opened = os.fstat(source)
              while chunk := os.read(source, 1024 * 1024):
                  digest.update(chunk)
                  offset = 0
                  while offset < len(chunk):
                      offset += os.write(target, chunk[offset:])
              os.fchmod(target, 0o500)
              os.fsync(target)
              opened_after = os.fstat(source)
          finally:
              os.close(source)
              os.close(target)
          identity = (before.st_dev, before.st_ino, before.st_size, before.st_mode)
          assert identity == (opened.st_dev, opened.st_ino, opened.st_size, opened.st_mode)
          assert identity == (opened_after.st_dev, opened_after.st_ino, opened_after.st_size, opened_after.st_mode)
          assert trusted.read_bytes()[:4] == b"\x7fELF"
          assert hashlib.sha256(trusted.read_bytes()).hexdigest() == digest.hexdigest()
          trusted = _owner_file(trusted, executable=True)
          probe = subprocess.run(
              [os.fspath(trusted), "-I", "-c", "import sys;print(f'{sys.version_info.major}.{sys.version_info.minor}');print(sys.base_prefix)"],
              check=True,
              capture_output=True,
              env={"LC_ALL": "C", "PATH": "/usr/bin:/bin"},
              text=True,
          ).stdout.splitlines()
          assert len(probe) == 2
          assert probe[0] == os.environ["EXPECTED_PYTHON"]
          assert Path(probe[1]).resolve(strict=True) == base_prefix
          after = trusted.stat()
          shim = Path(os.environ["RUNNER_TEMP"]) / "daimon-trusted-python-bin"
          shim.mkdir(mode=0o700)
          (shim / "python").symlink_to(trusted)
          with Path(os.environ["GITHUB_PATH"]).open("a", encoding="utf-8") as github_path:
              github_path.write(os.fspath(shim) + "\n")
          print(json.dumps({
              "base_prefix": os.fspath(base_prefix),
              "source_executable": os.fspath(executable),
              "executable": os.fspath(trusted),
              "sha256": digest.hexdigest(),
              "before": {"gid": before.st_gid, "mode": oct(stat.S_IMODE(before.st_mode)), "nlink": before.st_nlink, "uid": before.st_uid},
              "after": {"gid": after.st_gid, "mode": oct(stat.S_IMODE(after.st_mode)), "nlink": after.st_nlink, "uid": after.st_uid},
          }, sort_keys=True))
          PY
      - name: Install the offline qualification sandbox
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
      - run: python -m pip install -c constraints.txt -r requirements-dev.txt
      - name: Verify exact Matrix source pin
        run: |
          python - <<'PY'
          import importlib.metadata
          import json

          from clusterctl.matrix_host import MATRIX_CONTRACT_COMMIT

          direct_url = json.loads(
              importlib.metadata.distribution("daimon-matrix").read_text(
                  "direct_url.json"
              )
          )
          assert direct_url["vcs_info"]["commit_id"] == MATRIX_CONTRACT_COMMIT
          assert (
              importlib.metadata.distribution("daimon-matrix")
              .metadata["License-Expression"]
              == "MIT"
          )
          PY
      - name: Lint the Matrix, fence and mutation-journal boundaries
        run: >-
          python -m ruff check
          clusterctl/admission.py
          clusterctl/audit.py
          clusterctl/adapters.py
          clusterctl/cli.py
          clusterctl/distributed_rebirth.py
          clusterctl/embodiments.py
          clusterctl/fences.py
          clusterctl/idempotency.py
          clusterctl/inventory.py
          clusterctl/production_fences.py
          clusterctl/leases.py
          clusterctl/locks.py
          clusterctl/lifecycle.py
          clusterctl/matrix_host.py
          clusterctl/operation_journal.py
          clusterctl/park.py
          clusterctl/provision.py
          clusterctl/reconcile.py
          clusterctl/rebirth.py
          clusterctl/rebirth_host.py
          clusterctl/recovery_rebirth.py
          clusterctl/transfer.py
          clusterd/__main__.py
          clusterd/approvals.py
          clusterd/auth.py
          clusterd/confirm.py
          clusterd/handlers.py
          clusterd/openapi.py
          clusterd/routes.py
          clusterd/server.py
          steward_tools/mutations.py
          tests/test_matrix_host.py
          tests/test_admission.py
          tests/test_matrix_host_process.py
          tests/test_matrix_parity.py
          tests/test_matrix_status.py
          tests/test_operation_journal.py
          tests/test_park.py
          tests/test_production_fences.py
          tests/test_rebirth.py
          tests/test_recovery_rebirth.py
          tests/integration/recovery-rebirth/role.py
          tests/integration/test_recovery_rebirth_containers.py
          tests/test_transfer.py
          tests/test_volume_relocation.py
          tests/test_human_approvals.py
          tests/test_physical_preflight.py
          tests/test_rc_manifest.py
          scripts/h3-volume-drill.py
          tools/build_physical_preflight.py
          tools/build_rc_manifest.py
          tools/qualify_offline.py
          tools/check_rc_types.py
      - name: Type-check the Matrix, fence and mutation-journal boundaries
        run: python tools/check_rc_types.py
      - run: >-
          python -m compileall -q clusterctl clusterd steward_tools tests tools
      - run: >-
          python -m pytest -q
          -W error::ResourceWarning
          -W error::pytest.PytestUnraisableExceptionWarning

  backup-export-disposable:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - run: python -m pip install pytest==9.0.2
      - name: Verify disposable proof prerequisites
        run: |
          set -eu
          for tool in docker rsync ssh ssh-keygen ssh-keyscan; do
            command -v "$tool"
          done
          docker version
      - name: Prove isolated exporter and offline encrypted restore
        env:
          DAIMON_RUN_DOCKER_TESTS: "1"
        run: >-
          python -m pytest -q -s
          -W error::ResourceWarning
          -W error::pytest.PytestUnraisableExceptionWarning
          tests/integration/test_restic_export_container.py

  recovery-rebirth-disposable-hosts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: AlterMundi/daimon-matrix
          ref: bf5f7415f075af09442973144bc529f4c5ce7985
          path: matrix-source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13.5"
      - run: python -m pip install pytest==9.0.2
      - name: Verify disposable proof prerequisites
        run: |
          set -eu
          for tool in docker git; do
            command -v "$tool"
          done
          docker version
          test "$(git -C matrix-source rev-parse HEAD)" = \
            bf5f7415f075af09442973144bc529f4c5ce7985
      - name: Prove isolated recovery roles and read-only snapshot restore
        env:
          DAIMON_RUN_DOCKER_RECOVERY_TESTS: "1"
          DAIMON_MATRIX_SOURCE: ${{ github.workspace }}/matrix-source
        run: >-
          python -m pytest -q -s
          -W error::ResourceWarning
          -W error::pytest.PytestUnraisableExceptionWarning
          tests/integration/test_recovery_rebirth_containers.py
