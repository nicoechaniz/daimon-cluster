            (owner mismatch), or unattended-steward-denied'
          content: *id009
        '404':
          description: not found (CLI exit 3)
          content: *id009
        '409':
          description: 'confirmation required: body is a confirmation/v1 challenge
            (first POST) or a rejection (expired/reused/altered-digest/wrong-actor/wrong-target
            token)'
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ConfirmationChallenge'
                - *id010
        '429':
          description: 'mutation rate limit: 60 mutations/minute per token (sliding
            window)'
          content: *id009
        '501':
          description: confirmation validated; destroy execution is a later milestone
          content: *id009
        '500':
          description: internal error (CLI exit 10)
          content: *id009
