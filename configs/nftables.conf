#!/usr/sbin/nft -f
# daimonmatrix base firewall — daimon-cluster M1 (issue #6)
# Policy: default-deny inbound on the public interface; trust loopback,
# anyVPN mesh, and the Incus private bridge. SSH stays reachable everywhere
# (lockout prevention); ZeroTier transport stays reachable (mesh lifeline).

destroy table inet daimon-fw

table inet daimon-fw {
    chain input {
        type filter hook input priority 0; policy drop;

        iif "lo" accept
        ct state established,related accept
        ct state invalid drop

        # SSH — public + VPN, but NOT from containers (B5: containers reach
        # only the explicit services below).
        iifname != "incusbr0" tcp dport 22 accept

        # ZeroTier transport — the mesh must survive policy changes
        udp dport 9993 accept
        tcp dport 9993 accept

        # anyVPN mesh is the trusted management network: tribe broker
        # (8685), LCM legacy ports, future clusterd, incus API (VPN-only)
        iifname "zt*" accept

        # Incus private bridge: containers reach ONLY explicit host services
        # (DNS/DHCP on the bridge, tribe broker on the host anyVPN address).
        # Everything else container->host is denied (B5, threat model).
        iifname "incusbr0" udp dport 53 accept
        iifname "incusbr0" tcp dport 53 accept
        iifname "incusbr0" udp dport 67 accept
        iifname "incusbr0" tcp dport 8685 accept
        iifname "incusbr0" meta l4proto icmp accept
        iifname "incusbr0" drop

        # ICMP/ICMPv6 baseline
        meta l4proto { icmp, ipv6-icmp } accept
    }

    chain forward {
        type filter hook forward priority 0; policy drop;

        ct state established,related accept
        # no sibling-to-sibling traffic on the bridge (B5)
        iifname "incusbr0" oifname "incusbr0" drop
        # containers -> world (egress via NAT)
        iifname "incusbr0" accept
    }

    chain output {
        type filter hook output priority 0; policy accept;
    }
}
